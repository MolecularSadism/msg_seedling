[package]
name = "msg_seedling"
version = "0.3.1"
edition = "2024"
authors = ["ffmulks <63452434+ffmulks@users.noreply.github.com>"]
description = "A seedling-powered audio management crate for Bevy games with category-based volume, spatial audio, and randomization"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MolecularSadism/msg_seedling"
keywords = ["bevy", "audio", "game", "sound", "seedling"]
categories = ["game-development", "multimedia::audio"]

[features]
default = ["rand"]
rand = ["dep:rand", "bevy_seedling/rand"]

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset",
    "bevy_log",
] }
bevy_seedling = { version = "0.7", default-features = false, features = [
    "ogg",
    "wav",
    "reflect",
] }
rand = { version = "0.9", features = ["small_rng"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }
msg_testing = { git = "https://github.com/MolecularSadism/msg_testing" }

[[bench]]
name = "hot_path"
harness = false

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
