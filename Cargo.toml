[package]
name = "msg_seedling"
version = "0.7.1"
edition = "2024"
authors = ["ffmulks <63452434+ffmulks@users.noreply.github.com>"]
description = "A seedling-powered audio management crate for Bevy games with category-based volume, spatial audio, and randomization"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MolecularSadism/msg_seedling"
keywords = ["bevy", "audio", "game", "sound", "seedling"]
categories = ["game-development", "multimedia::audio"]

[features]
default = ["rand"]
rand = ["dep:rand", "bevy_seedling/rand"]
# Serde impls for the types a host authors in data files (the damping field
# and which endpoints it reads). Off by default: nothing in the crate reads
# or writes a file itself.
serde = ["dep:serde"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset",
    "bevy_log",
] }
bevy_seedling = { version = "0.8", default-features = false, features = [
    "ogg",
    "wav",
    "reflect",
    "cpal",
    "effects",
] }
rand = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"], default-features = false, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Hands the null backend's render buffers to Firewheel's processor.
audioadapter-buffers = { version = "4", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }
msg_testing = { git = "https://github.com/MolecularSadism/msg_testing", tag = "v0.5.0" }
# Exercises the `serde` feature against the data format hosts actually
# author damping fields in.
ron = "0.12"

[[bench]]
name = "hot_path"
harness = false

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
